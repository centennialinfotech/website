<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing - Centennial Infotech</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: white;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1900px;
        margin: 90px auto;
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px;
        text-align: center;
      }

      .header h1 {
        font-size: 2.5em;
        margin-bottom: 10px;
      }

      .content {
        padding: 30px;
        min-height: 500px;
      }

      .content h2 {
        margin-bottom: 20px;
        color: #333;
      }

      /* Updated grid for 4 cards per row */
      .public-services {
        display: grid;
        grid-template-columns: repeat(4, 1fr); /* Forces exactly 4 columns */
        gap: 20px;
        margin-top: 20px;
      }

      /* Responsive design */
      @media (max-width: 1200px) {
        .public-services {
          grid-template-columns: repeat(
            3,
            1fr
          ); /* 3 columns on medium screens */
        }
      }

      @media (max-width: 900px) {
        .public-services {
          grid-template-columns: repeat(2, 1fr); /* 2 columns on tablets */
        }
      }

      @media (max-width: 600px) {
        .public-services {
          grid-template-columns: 1fr; /* 1 column on mobile */
        }
      }

      .public-card {
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        transition:
          transform 0.3s,
          box-shadow 0.3s;
        cursor: pointer;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .public-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
      }

      .public-card .card-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        text-align: center;
      }

      .public-card .card-header h3 {
        font-size: 1.5em;
        margin-bottom: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .public-card .card-header p {
        font-size: 0.9em;
        opacity: 0.9;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .public-card .card-body {
        padding: 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .tier-pricing {
        display: flex;
        justify-content: space-around;
        margin: 15px 0;
        padding: 12px;
        background: #f8f9fa;
        border-radius: 10px;
        gap: 5px;
      }

      .tier-item {
        text-align: center;
        flex: 1;
      }

      .tier-item strong {
        font-size: 0.9em;
        color: #495057;
      }

      .tier-price {
        font-size: 1.1em;
        font-weight: bold;
        color: #28a745;
        margin-top: 3px;
      }

      .buy-btn {
        width: 100%;
        padding: 12px;
        background: #28a745;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: auto;
      }

      .buy-btn:hover {
        background: #218838;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
      }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .modal.active {
        display: flex;
      }

      .modal-content {
        background: white;
        padding: 30px;
        border-radius: 15px;
        max-width: 800px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
        position: relative;
      }

      .close {
        position: absolute;
        top: 15px;
        right: 20px;
        font-size: 28px;
        cursor: pointer;
        color: #666;
      }

      .close:hover {
        color: #333;
      }

      .loading {
        text-align: center;
        padding: 50px;
        font-size: 18px;
        color: #666;
        grid-column: 1 / -1;
      }

      .error {
        background: #f8d7da;
        color: #721c24;
        padding: 15px;
        border-radius: 8px;
        margin: 20px 0;
        text-align: center;
        grid-column: 1 / -1;
      }

      .categories-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 20px 0;
      }

      .category-tag {
        background: #e9ecef;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 14px;
        color: #495057;
      }

      .details-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin: 20px 0;
      }

      .detail-section {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 10px;
      }

      .detail-section h4 {
        margin-bottom: 10px;
        color: #667eea;
      }

      .tiers-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin: 20px 0;
      }

      .tier-detail-card {
        border: 2px solid #dee2e6;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
      }

      .tier-detail-card h4 {
        font-size: 20px;
        margin-bottom: 10px;
      }

      .tier-detail-price {
        font-size: 28px;
        font-weight: bold;
        color: #28a745;
        margin: 10px 0;
      }

      .btn-success {
        background: #28a745;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }

      .btn-success:hover {
        background: #218838;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Production-Ready Project Solutions</h1>
        <!-- <p>Choose the perfect plan for your business</p> -->
      </div>

      <div class="content">
        <h2>📋 Our Services</h2>
        <div id="public-services" class="public-services">
          <div class="loading">Loading services...</div>
        </div>
      </div>
    </div>

    <!-- Details Modal -->
    <div id="details-modal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeDetailsModal()">&times;</span>
        <div id="details-content"></div>
      </div>
    </div>

    <script>
      // ==================== CONFIGURATION ====================
      const backendUrl = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
          ? 'http://localhost:3001'
          : 'https://website-backend-wk8l.onrender.com';
      const API_URL = `${backendUrl}/api/public`;

      // ==================== LOAD SERVICES ====================
      async function loadPublicServices() {
        const container = document.getElementById("public-services");
        container.innerHTML = '<div class="loading">Loading services...</div>';

        try {
          const response = await fetch(`${API_URL}/services`);
          const data = await response.json();

          if (data.success && data.data.length > 0) {
            container.innerHTML = data.data
              .map(
                (service) => `
                            <div class="public-card" onclick="showServiceDetails('${service._id}')">
                                <div class="card-header">
                                    <h3>${service.title}</h3>
                                    <p>${service.description.substring(0, 80)}...</p>
                                </div>
                                <div class="card-body">
                                    <div class="tier-pricing">
                                        ${service.tiers
                                          .slice(0, 3) // Show max 3 tiers
                                          .map(
                                            (tier) => `
                                            <div class="tier-item">
                                                <div><strong>${tier.title}</strong></div>
                                                <div class="tier-price">$${tier.price}</div>
                                            </div>
                                        `,
                                          )
                                          .join("")}
                                    </div>
                                    <button class="buy-btn" onclick="event.stopPropagation(); buyService('${service._id}')">
                                        💳 Buy Now
                                    </button>
                                </div>
                            </div>
                        `,
              )
              .join("");
          } else {
            container.innerHTML = "<p>No services available yet.</p>";
          }
        } catch (error) {
          console.error("Load error:", error);
          container.innerHTML =
            '<div class="error">Failed to load services. Make sure backend is running.</div>';
        }
      }

      // ==================== SERVICE DETAILS ====================
      async function showServiceDetails(id) {
        try {
          const response = await fetch(`${API_URL}/services/${id}`);
          const result = await response.json();

          if (result.success) {
            const service = result.data;

            const detailsHTML = `
                        <h2 style="margin-bottom: 15px;">${service.title}</h2>
                        <p style="margin: 20px 0; line-height: 1.6;">${service.description}</p>
                        
                        <div class="details-grid">
                            ${
                              service.categories?.length
                                ? `
                                <div class="detail-section">
                                    <h4>📌 Categories</h4>
                                    <div class="categories-grid">
                                        ${service.categories.map((cat) => `<span class="category-tag">${cat}</span>`).join("")}
                                    </div>
                                </div>
                            `
                                : ""
                            }
                            
                            ${
                              service.industries?.length
                                ? `
                                <div class="detail-section">
                                    <h4>🏢 Industries</h4>
                                    <div class="categories-grid">
                                        ${service.industries.map((ind) => `<span class="category-tag">${ind}</span>`).join("")}
                                    </div>
                                </div>
                            `
                                : ""
                            }
                            
                            ${
                              service.sources?.length
                                ? `
                                <div class="detail-section">
                                    <h4>📢 Sources</h4>
                                    <div class="categories-grid">
                                        ${service.sources.map((src) => `<span class="category-tag">${src}</span>`).join("")}
                                    </div>
                                </div>
                            `
                                : ""
                            }
                        </div>
                        
                        <h3 style="margin: 25px 0 15px;">💰 Pricing Plans</h3>
                        <div class="tiers-grid">
                            ${service.tiers
                              .map(
                                (tier) => `
                                <div class="tier-detail-card">
                                    <h4>${tier.title}</h4>
                                    <div class="tier-detail-price">$${tier.price}</div>
                                    <p style="margin: 10px 0;">${tier.description}</p>
                                    <button class="btn-success" style="width:100%; margin-top:10px;" onclick="buyService('${service._id}')">
                                        Buy Now
                                    </button>
                                </div>
                            `,
                              )
                              .join("")}
                        </div>
                    `;

            document.getElementById("details-content").innerHTML = detailsHTML;
            document.getElementById("details-modal").classList.add("active");
          }
        } catch (error) {
          console.error("Details error:", error);
          alert("❌ Failed to load service details");
        }
      }

      function closeDetailsModal() {
        document.getElementById("details-modal").classList.remove("active");
      }

      function buyService(id) {
        alert("🛒 Payment integration will go here for service: " + id);
      }

      // Initialize
      document.addEventListener("DOMContentLoaded", loadPublicServices);
    </script>
  </body>
</html>
