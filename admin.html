<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Centennial Infotech</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: white;
        min-height: 100vh;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* White centered container */
      .admin-container {
        max-width: 550px;
        width: 100%;
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        margin: 0 auto;
      }

      .header {
        background: white;
        color: #333;
        padding: 40px 30px 20px;
        text-align: center;
      }

      .header h1 {
        font-size: 49px;
        margin-bottom: 5px;
        font-weight: 700;
      }

      .header p {
        color: #666;
        font-size: 21px;
        margin-top: 5px;
      }

      .content {
        padding: 20px 30px 40px;
      }

      .login-container {
        width: 100%;
      }

      .login-container h2 {
        text-align: center;
        color: #333;
        margin-bottom: 25px;
        font-size: 1.5em;
        font-weight: 500;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
        color: #333;
        font-size: 19px;
      }

      .form-group input {
        width: 100%;
        padding: 16px 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 17px;
        transition: border-color 0.3s;
      }

      .form-group input:focus {
        outline: none;
        border-color: #667eea;
      }

      .btn {
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        transition: all 0.3s;
      }

      .btn-primary {
        width: 100%;
        height: 70px;
        background: #667eea;
        color: white;
        margin: 20px 0 15px;
      }

      .btn-primary:hover {
        background: #5a67d8;
      }

      .secure-note {
        text-align: center;
        color: #666;
        font-size: 13px;
        margin: 15px 0 10px;
        padding: 0 10px;
      }

      .forgot-password {
        text-align: center;
        margin-top: 15px;
      }

      .forgot-password a {
        color: #667eea;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
      }

      .forgot-password a:hover {
        text-decoration: underline;
      }

      #login-error {
        color: red;
        text-align: center;
        margin-top: 10px;
        font-size: 13px;
      }

      /* Hide other sections initially */
      #admin-section,
      #add-section {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="admin-container">
      <div class="header">
        <h1>Admin Login</h1>
        <p></p>
      </div>

      <div class="content">
        <!-- Login Section -->
        <div id="login-section">
          <div class="login-container">
            <div class="form-group">
              <label>Email *</label>
              <input
                type="email"
                id="login-email"
                placeholder="admin@gmail.com"
              />
            </div>

            <div class="form-group">
              <label>Password *</label>
              <input
                type="password"
                id="login-password"
                placeholder="••••••••"
              />
            </div>

            <button onclick="handleLogin()" class="btn btn-primary">
              LOGIN
            </button>

            <div class="secure-note">
              Access credentials are managed via the secure environment
              configuration.
            </div>

            <div class="forgot-password">
              <a
                href="#"
                onclick="alert('Contact administrator to reset password')"
                >Forgot/Reset password?</a
              >
            </div>

            <div id="login-error"></div>
          </div>
        </div>

        <!-- Admin Panel Section (hidden initially) -->
        <div id="admin-section" style="display: none">
          <h2>📊 Manage Services</h2>
          <button class="btn btn-primary" onclick="showAddSection()">
            ➕ Add New Service
          </button>
          <div id="admin-services-list">
            <div class="loading">Loading services...</div>
          </div>
          <button
            class="btn btn-danger"
            onclick="handleLogout()"
            style="margin-top: 20px"
          >
            🚪 Logout
          </button>
        </div>

        <!-- Add Service Section (hidden initially) -->
        <div id="add-section" style="display: none">
          <h2>➕ Add New Service</h2>
          <form id="service-form" onsubmit="saveService(event)">
            <div class="form-group">
              <label>Service Title *</label>
              <input
                type="text"
                id="title"
                required
                placeholder="e.g., Web Design & Development"
              />
            </div>

            <div class="form-group">
              <label>Description *</label>
              <textarea
                id="description"
                required
                rows="3"
                placeholder="Describe your service..."
              ></textarea>
            </div>

            <div class="form-group">
              <label>Categories (comma separated)</label>
              <input
                type="text"
                id="categories"
                placeholder="E-commerce, Business, Portfolio"
              />
            </div>

            <div class="form-group">
              <label>Industries (comma separated)</label>
              <input
                type="text"
                id="industries"
                placeholder="Healthcare, Finance, Education"
              />
            </div>

            <div class="form-group">
              <label>Sources (comma separated)</label>
              <input
                type="text"
                id="sources"
                placeholder="Google Ads, LinkedIn, Facebook"
              />
            </div>

            <h3>💰 Pricing Tiers</h3>
            <div id="tiers-container"></div>

            <button
              type="button"
              class="btn btn-success"
              onclick="addTier()"
              style="margin: 10px 0"
            >
              + Add Another Tier
            </button>

            <div style="display: flex; gap: 10px; margin-top: 20px">
              <button
                type="button"
                class="btn btn-danger"
                onclick="showAdminSection()"
                style="flex: 1"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary" style="flex: 1">
                💾 Save Service
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      // ==================== CONFIGURATION ====================
      const API_URL = "https://website-backend-zl1c.onrender.com/api";
      let tierCount = 0;

      // ==================== ADMIN AUTH ====================
      document.addEventListener("DOMContentLoaded", () => {
        const isAdmin = localStorage.getItem("isAdmin") === "true";
        if (isAdmin) {
          showAdminSection();
          loadAdminServices();
        }
      });

      async function handleLogin() {
        const email = document.getElementById("login-email").value;
        const password = document.getElementById("login-password").value;
        const errorDiv = document.getElementById("login-error");

        if (!email || !password) {
          errorDiv.textContent = "Please enter email and password";
          return;
        }

        try {
          const response = await fetch(`${API_URL}/admin/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const result = await response.json();

          if (result.success) {
            localStorage.setItem("isAdmin", "true");
            localStorage.setItem("adminEmail", email);
            showAdminSection();
            loadAdminServices();
          } else {
            errorDiv.textContent =
              result.message || "Invalid email or password";
          }
        } catch (error) {
          errorDiv.textContent =
            "Connection error. Make sure backend is running.";
        }
      }

      function handleLogout() {
        localStorage.removeItem("isAdmin");
        localStorage.removeItem("adminEmail");
        showLoginSection();
      }

      function showLoginSection() {
        document.getElementById("login-section").style.display = "block";
        document.getElementById("admin-section").style.display = "none";
        document.getElementById("add-section").style.display = "none";
      }

      function showAdminSection() {
        document.getElementById("login-section").style.display = "none";
        document.getElementById("admin-section").style.display = "block";
        document.getElementById("add-section").style.display = "none";
      }

      function showAddSection() {
        document.getElementById("login-section").style.display = "none";
        document.getElementById("admin-section").style.display = "none";
        document.getElementById("add-section").style.display = "block";

        // Add default tier if none exist
        if (document.getElementById("tiers-container").children.length === 0) {
          addTier();
        }
      }

      // ==================== LOAD ADMIN SERVICES ====================
      async function loadAdminServices() {
        const container = document.getElementById("admin-services-list");
        container.innerHTML = '<div class="loading">Loading services...</div>';

        try {
          const response = await fetch(`${API_URL}/services`);
          const data = await response.json();

          if (data.success && data.data.length > 0) {
            let html =
              '<div style="display: grid; gap: 20px; margin-top: 20px;">';

            data.data.forEach((service) => {
              const prices = service.tiers.map((t) => t.price);
              const minPrice = Math.min(...prices);
              const maxPrice = Math.max(...prices);

              html += `
                            <div style="border: 1px solid #ddd; border-radius: 8px; padding: 15px; background: #f8f9fa;">
                                <h3 style="margin-bottom: 5px;">${service.title}</h3>
                                <p style="color: #666; font-size: 14px;">${service.description.substring(0, 100)}...</p>
                                <div style="font-size: 20px; color: #667eea; font-weight: bold; margin: 10px 0;">$${minPrice} - $${maxPrice}</div>
                                <div style="display: flex; gap: 10px;">
                                    <button onclick='editService("${service._id}")' style="flex: 1; padding: 8px; background: #ffc107; border: none; border-radius: 5px; cursor: pointer;">✏️ Edit</button>
                                    <button onclick='deleteService("${service._id}", "${service.title}")' style="flex: 1; padding: 8px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer;">🗑️ Delete</button>
                                </div>
                            </div>
                        `;
            });

            html += "</div>";
            container.innerHTML = html;
          } else {
            container.innerHTML =
              '<p>No services yet. Click "Add New Service" to create one.</p>';
          }
        } catch (error) {
          container.innerHTML =
            '<div class="error">Failed to load services.</div>';
        }
      }

      function addTier() {
        const container = document.getElementById("tiers-container");
        tierCount++;

        const tierHtml = `
                <div class="tier-group" id="tier-${tierCount}" style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #dee2e6;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <h4>Tier ${tierCount}</h4>
                        <button type="button" onclick="removeTier(${tierCount})" style="background: #dc3545; color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer;">×</button>
                    </div>
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" class="tier-title" placeholder="e.g., Basic" value="Basic" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" class="tier-desc" placeholder="e.g., Basic package" value="Basic package" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                    </div>
                    <div class="form-group">
                        <label>Price ($)</label>
                        <input type="number" class="tier-price" placeholder="199" value="0" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                    </div>
                </div>
            `;

        container.insertAdjacentHTML("beforeend", tierHtml);
      }

      function removeTier(id) {
        const element = document.getElementById(`tier-${id}`);
        if (element) element.remove();
      }

      async function editService(id) {
        try {
          const response = await fetch(`${API_URL}/services/${id}`);
          const result = await response.json();

          if (result.success) {
            const service = result.data;

            // Create modal HTML
            const modalHtml = `
                <div id="edit-modal" class="modal" style="display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
                    <div style="background: white; padding: 30px; border-radius: 15px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative;">
                        <span onclick="closeEditModal()" style="position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: #666;">&times;</span>
                        <h2 style="margin-bottom: 20px;">✏️ Edit Service</h2>
                        
                        <form id="edit-service-form" onsubmit="updateService(event, '${service._id}')">
                            <input type="hidden" id="edit-id" value="${service._id}" />
                            
                            <div class="form-group" style="margin-bottom: 15px;">
                                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Title *</label>
                                <input type="text" id="edit-title" value="${service.title || ""}" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                            </div>

                            <div class="form-group" style="margin-bottom: 15px;">
                                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Description *</label>
                                <textarea id="edit-description" required rows="4" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">${service.description || ""}</textarea>
                            </div>

                            <div class="form-group" style="margin-bottom: 15px;">
                                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Categories (comma separated)</label>
                                <input type="text" id="edit-categories" value="${(service.categories || []).join(", ")}" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                            </div>

                            <div class="form-group" style="margin-bottom: 15px;">
                                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Industries (comma separated)</label>
                                <input type="text" id="edit-industries" value="${(service.industries || []).join(", ")}" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                            </div>

                            <div class="form-group" style="margin-bottom: 15px;">
                                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Sources (comma separated)</label>
                                <input type="text" id="edit-sources" value="${(service.sources || []).join(", ")}" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                            </div>

                            <h3 style="margin: 20px 0 10px;">💰 Pricing Tiers</h3>
                            <div id="edit-tiers-container"></div>

                            <button type="button" onclick="addEditTier()" style="background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 10px 0;">
                                + Add Another Tier
                            </button>

                            <div style="display: flex; gap: 10px; margin-top: 20px;">
                                <button type="button" onclick="closeEditModal()" style="flex: 1; padding: 12px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer;">Cancel</button>
                                <button type="submit" style="flex: 1; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">💾 Update Service</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;

            // Remove any existing modal
            const existingModal = document.getElementById("edit-modal");
            if (existingModal) existingModal.remove();

            // Add modal to body
            document.body.insertAdjacentHTML("beforeend", modalHtml);

            // Load tiers into modal
            const container = document.getElementById("edit-tiers-container");

            if (service.tiers && service.tiers.length > 0) {
              service.tiers.forEach((tier, index) => {
                const tierHtml = `
                        <div class="edit-tier-group" id="edit-tier-${index}" style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #dee2e6;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <h4 style="margin:0;">Tier ${index + 1}</h4>
                                ${service.tiers.length > 1 ? `<button type="button" onclick="removeEditTier(${index})" style="background: #dc3545; color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer;">×</button>` : ""}
                            </div>
                            <div style="margin-bottom: 10px;">
                                <label style="display: block; margin-bottom: 5px;">Title</label>
                                <input type="text" class="edit-tier-title" value="${tier.title || ""}" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                            </div>
                            <div style="margin-bottom: 10px;">
                                <label style="display: block; margin-bottom: 5px;">Description</label>
                                <input type="text" class="edit-tier-desc" value="${tier.description || ""}" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                            </div>
                            <div style="margin-bottom: 10px;">
                                <label style="display: block; margin-bottom: 5px;">Price ($)</label>
                                <input type="number" class="edit-tier-price" value="${tier.price || 0}" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                            </div>
                        </div>
                    `;
                container.insertAdjacentHTML("beforeend", tierHtml);
              });
            } else {
              addEditTier();
            }
          } else {
            alert("❌ Failed to load service details");
          }
        } catch (error) {
          console.error("Edit error:", error);
          alert("❌ Error loading service for editing");
        }
      }

      async function updateService(event, id) {
        event.preventDefault();

        // Collect tiers from modal
        const tiers = [];
        const tierGroups = document.querySelectorAll(
          "#edit-tiers-container .edit-tier-group",
        );

        if (tierGroups.length === 0) {
          alert("❌ Please add at least one pricing tier!");
          return;
        }

        for (let i = 0; i < tierGroups.length; i++) {
          const tier = tierGroups[i];
          const titleInput = tier.querySelector(".edit-tier-title");
          const descInput = tier.querySelector(".edit-tier-desc");
          const priceInput = tier.querySelector(".edit-tier-price");

          if (
            !titleInput.value ||
            !descInput.value ||
            !priceInput.value ||
            parseFloat(priceInput.value) <= 0
          ) {
            alert(
              `❌ Tier ${i + 1}: All fields are required and price must be greater than 0`,
            );
            return;
          }

          tiers.push({
            title: titleInput.value,
            description: descInput.value,
            price: parseFloat(priceInput.value),
          });
        }

        const serviceData = {
          title: document.getElementById("edit-title").value,
          description: document.getElementById("edit-description").value,
          categories: document
            .getElementById("edit-categories")
            .value.split(",")
            .map((s) => s.trim())
            .filter((s) => s),
          industries: document
            .getElementById("edit-industries")
            .value.split(",")
            .map((s) => s.trim())
            .filter((s) => s),
          sources: document
            .getElementById("edit-sources")
            .value.split(",")
            .map((s) => s.trim())
            .filter((s) => s),
          tiers: tiers,
        };

        if (!serviceData.title || !serviceData.description) {
          alert("❌ Title and Description are required!");
          return;
        }

        try {
          const response = await fetch(`${API_URL}/services/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(serviceData),
          });

          const result = await response.json();

          if (result.success) {
            alert("✅ Service updated successfully!");
            closeEditModal();
            loadAdminServices(); // Refresh the list
          } else {
            alert(
              "❌ Failed to update service: " +
                (result.message || "Unknown error"),
            );
          }
        } catch (error) {
          console.error("Update error:", error);
          alert("❌ Error updating service. Make sure backend is running.");
        }
      }

      // ==================== ADD EDIT TIER ====================
      function addEditTier() {
        const container = document.getElementById("edit-tiers-container");
        const index = container.children.length;

        const tierHtml = `
        <div class="edit-tier-group" id="edit-tier-${index}" style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #dee2e6;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h4 style="margin:0;">Tier ${index + 1}</h4>
                <button type="button" onclick="removeEditTier(${index})" style="background: #dc3545; color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer;">×</button>
            </div>
            <div style="margin-bottom: 10px;">
                <label style="display: block; margin-bottom: 5px;">Title</label>
                <input type="text" class="edit-tier-title" placeholder="e.g., Basic" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
            </div>
            <div style="margin-bottom: 10px;">
                <label style="display: block; margin-bottom: 5px;">Description</label>
                <input type="text" class="edit-tier-desc" placeholder="e.g., Basic package" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
            </div>
            <div style="margin-bottom: 10px;">
                <label style="display: block; margin-bottom: 5px;">Price ($)</label>
                <input type="number" class="edit-tier-price" placeholder="199" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
            </div>
        </div>
    `;

        container.insertAdjacentHTML("beforeend", tierHtml);
      }

      // ==================== REMOVE EDIT TIER ====================
      function removeEditTier(index) {
        const element = document.getElementById(`edit-tier-${index}`);
        if (element) {
          element.remove();

          // Renumber remaining tiers
          const container = document.getElementById("edit-tiers-container");
          Array.from(container.children).forEach((child, i) => {
            child.id = `edit-tier-${i}`;
            const header = child.querySelector("h4");
            if (header) {
              header.textContent = `Tier ${i + 1}`;
            }
            const removeBtn = child.querySelector("button[onclick]");
            if (removeBtn) {
              removeBtn.setAttribute("onclick", `removeEditTier(${i})`);
            }
          });
        }
      }

      // ==================== CLOSE EDIT MODAL ====================
      function closeEditModal() {
        const modal = document.getElementById("edit-modal");
        if (modal) modal.remove();
      }

      // =============
      // ======= RESET TO ADD MODE ====================
      function resetToAddMode() {
        // Reset form title
        document.querySelector("#add-section h2").textContent =
          "➕ Add New Service";

        // Reset form
        document.getElementById("service-form").reset();
        document.getElementById("tiers-container").innerHTML = "";
        tierCount = 0;
        addTier();

        // Reset save button
        const saveBtn = document.querySelector(
          "#service-form button[type='submit']",
        );
        saveBtn.textContent = "💾 Save Service";

        // Reset form submission to original saveService
        document.getElementById("service-form").onsubmit = saveService;

        // Clear editing ID
        delete window.editingServiceId;
      }

      // ==================== MODIFY SAVE SERVICE ====================

      // ==================== SAVE SERVICE ====================
      async function saveService(event) {
        event.preventDefault();

        // Check if admin
        if (localStorage.getItem("isAdmin") !== "true") {
          alert("❌ Admin access required!");
          showLoginSection();
          return;
        }

        // Collect tiers
        const tiers = [];
        const tierGroups = document.querySelectorAll(
          "#tiers-container .tier-group",
        );

        if (tierGroups.length === 0) {
          alert("❌ Please add at least one pricing tier!");
          return;
        }

        for (let i = 0; i < tierGroups.length; i++) {
          const tier = tierGroups[i];
          const titleInput = tier.querySelector(".tier-title");
          const descInput = tier.querySelector(".tier-desc");
          const priceInput = tier.querySelector(".tier-price");

          if (!titleInput || !descInput || !priceInput) {
            alert(`❌ Tier ${i + 1}: Input fields not found`);
            return;
          }

          if (!titleInput.value || !descInput.value || !priceInput.value) {
            alert(`❌ Tier ${i + 1}: All fields are required`);
            return;
          }

          const price = parseFloat(priceInput.value);
          if (isNaN(price) || price <= 0) {
            alert(
              `❌ Tier ${i + 1}: Price must be a valid number greater than 0`,
            );
            return;
          }

          tiers.push({
            title: titleInput.value.trim(),
            description: descInput.value.trim(),
            price: price,
          });
        }

        // Get form values
        const title = document.getElementById("title")?.value;
        const description = document.getElementById("description")?.value;
        const categoriesInput = document.getElementById("categories")?.value;
        const industriesInput = document.getElementById("industries")?.value;
        const sourcesInput = document.getElementById("sources")?.value;

        if (!title || !description) {
          alert("❌ Title and Description are required!");
          return;
        }

        // Parse comma-separated values
        const categories = categoriesInput
          ? categoriesInput
              .split(",")
              .map((s) => s.trim())
              .filter((s) => s)
          : [];
        const industries = industriesInput
          ? industriesInput
              .split(",")
              .map((s) => s.trim())
              .filter((s) => s)
          : [];
        const sources = sourcesInput
          ? sourcesInput
              .split(",")
              .map((s) => s.trim())
              .filter((s) => s)
          : [];

        const serviceData = {
          title: title.trim(),
          description: description.trim(),
          categories: categories,
          industries: industries,
          sources: sources,
          tiers: tiers,
        };

        console.log("📤 Sending service data:", serviceData);

        try {
          const response = await fetch(`${API_URL}/services/create`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify(serviceData),
          });

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(
              `Server responded with status ${response.status}: ${errorText}`,
            );
          }

          const result = await response.json();
          console.log("📦 Server response:", result);

          if (result.success) {
            alert("✅ Service added successfully!");

            // Reset form
            document.getElementById("service-form").reset();
            document.getElementById("tiers-container").innerHTML = "";
            tierCount = 0;

            // Add one default tier
            addTier();

            // Go back to admin section and refresh
            showAdminSection();
            await loadAdminServices();
          } else {
            alert(
              "❌ Failed to add service: " +
                (result.message || "Unknown error"),
            );
          }
        } catch (error) {
          console.error("❌ Save error:", error);
          alert("❌ Error adding service: " + error.message);
        }
      }

      // ==================== DELETE SERVICE ====================
      async function deleteService(id, title) {
        if (!confirm(`Are you sure you want to delete "${title}"?`)) return;

        try {
          const response = await fetch(`${API_URL}/services/${id}`, {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
          });

          const result = await response.json();

          if (result.success) {
            alert("✅ Service deleted successfully!");
            loadAdminServices();
          } else {
            alert(
              "❌ Failed to delete service: " +
                (result.message || "Unknown error"),
            );
          }
        } catch (error) {
          alert("❌ Error deleting service. Make sure backend is running.");
        }
      }
